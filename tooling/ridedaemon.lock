# Rebuilt 2026-10-08 (RideLink lib phase 1): branch ridelink-phase1, seven commits on top of
# a2b9191 (the p2c-channel-routing build below). Not pushed to the fork yet, so CI's locked
# RideDaemon checkout cannot fetch source_commit until it is.
#
# Same build shape: -androidapi 31, 4 ABIs. Binding surface diffed with javap: purely
# additive, exactly MobileSession.sendPhoneCommand(long, byte[], long) and the new
# api.PhoneCommandReply (get/setCommand, get/setBody). Nothing in the app calls
# sendPhoneCommand yet; phase 2 does.
#
# New transport event cmd 5 (core.TransportCmdKeyframeNeeded), payload a 4-byte big-endian
# count of dropped frames: the live queue overflowed with no IDR left in it and now drops to
# the next one, so the dash's picture is frozen until it arrives. Raised at most once a second
# and again each second the IDR is still owed; never for JPEG stills. RideDaemonTransport
# answers it with an encoder sync-frame request.

# Rebuilt 2026-10-06 (issue #12): phone-originated PXC commands go out on the phone channel.
#
# Built from branch p2c-channel-routing (source_commit, one commit on top of ee609e5 from
# vincenzobpt/ridedaemon-lib), on the AnotherJack260 fork until it is merged upstream.
# Go 1.27.1, gomobile v0.0.0-20251126181937-5c265dc024c4, NDK r30.
#
# The dash opens two PXC connections. CarbitRide 2.4 (h0.java) answers the dash's requests
# on the one opened with 0x10000 and writes every command of its own - CHECK_SN_RESULT,
# APPSTATUS, the page commands - only on the one opened with 0x20000 (z.e -> x0). This
# daemon wrote them on the 0x10000 one; a Zontes JCDZ21 hung up on 0x20030 there within
# 18ms, five sessions out of five, and never sent CHECK_SN_DONE.
#
#  1. APPSTATUS and the page probe use the 0x20000 connection only, and are skipped when the
#     dash has not opened it, as CarbitRide's t0.q0 does.
#  2. CHECK_SN_RESULT waits up to 3s for that connection and falls back to the request one
#     when it never opens, so a dash that never opens it is answered exactly as before.
#  3. The first APPSTATUS (mode 2) goes out when the 0x20000 connection opens, not after
#     CLIENT_INFO_RLY.
#  4. Both opening frames now reach the event stream, so a rider's log shows them.
#
# Binding surface diffed with javap: api.* byte-identical to the previous artifact.

# Rebuilt 2026-09-12: the phone now states its mirroring state to the head unit, and
# the capture reply is the length the official app writes.
#
# Three changes, all read out of the CarbitRide APK rather than guessed:
#
#  1. ECP_P2C_APPSTATUS_BACKGROUND (0x20030). kh/b.java, sent by the official app twice
#     per connection - mode 2 when PXC comes up (vf.s.b0()) and mode 1 when
#     REQ_RV_DATA_START has been answered 113 (n0.setTrueMirror()). It is the only
#     statement the app ever volunteers that a mirror exists. No reference
#     implementation sends it and neither did this daemon. Opt-in per profile through
#     MobileConfig.AppStatusNotifyEnabled, with the phone's display metrics supplied by
#     the host in PhoneScreenWidth/Height/Rotation.
#  2. RLY_RV_CONFIG_CAPTURE is 8 bytes when the dash declares supportExtendProtocol=0.
#     Protocol.RlyConfigCapture.size() appends the framing byte only when it is
#     non-zero; this daemon sent 9 either way, so every dashboard in that family was
#     handed a trailing zero the official app never writes.
#  3. supportFunction is stated in CLIENT_INFO_RLY. ECP_C2P_CLIENT_INFO.g0() always
#     writes it and open-cflink's captured handshake carries it; this daemon computed
#     the value and put it only in the MEDIA_CONTROL 0x60 reply, which firmware running
#     without the extend protocol never asks for.
#
# source_commit is on the public origin (pushed 2026-09-12), so anyone can fetch the
# exact source this artifact was built from.
#
# Same build shape as the previous artifact: -androidapi 31, 4 ABIs. Binding surface
# diffed against the old AAR with javap: purely additive, exactly
# get/setAppStatusNotifyEnabled and get/setPhoneScreenWidth|Height|Rotation on
# api.MobileConfig; api.MobileSession and api.Api byte-identical.
